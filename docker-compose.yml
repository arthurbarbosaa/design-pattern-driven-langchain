services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    command: python -m uvicorn server:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - backend
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://backend:8000/v1
      - OPENAI_API_KEY=sk-fake
    volumes:
      - open-webui:/app/backend/data
    restart: always

volumes:
  open-webui:
